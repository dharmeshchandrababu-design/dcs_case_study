version: 2
sources:
  - name: raw
    description: Tables written by the Python steps. dbt only reads them.
    tables:
      - name: posts
        description: One row per post, written by load.py (required fields, hashed author id, no usernames).
      - name: labels
        description: AI labels written by label.py. One row per post and model_version; model_version records which labeller, model and prompt version produced the label. text_en is the English translation for relevant non-English posts.
