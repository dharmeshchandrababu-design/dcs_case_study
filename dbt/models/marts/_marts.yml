version: 2
models:
  - name: dim_theme
    description: Business view of each problem, from the taxonomy seed. dcs_lever says whether DCS can fix it (yes, partly, no).
    columns:
      - name: theme_key
        tests: [unique, not_null]
  - name: dim_network
    description: Charging networks and their role for DCS (dcs, cpo partner, emsp_competitor, both), plus none and unknown.
    columns:
      - name: network_key
        tests: [unique, not_null]
  - name: dim_date
    columns:
      - name: date_key
        tests: [unique, not_null]
  - name: fct_posts
    description: >
      One relevant post not clearly outside Europe. is_negative counts negative and mixed posts.
      severity keeps the AI severity only when the text also contains matching evidence (macro severity_checked);
      severity_ai is the raw AI label.
    columns:
      - name: post_id
        tests: [unique, not_null]
      - name: theme_key
        tests:
          - relationships:
              arguments: {to: ref('dim_theme'), field: theme_key}
      - name: network_key
        tests:
          - relationships:
              arguments: {to: ref('dim_network'), field: network_key}
      - name: date_key
        tests:
          - relationships:
              arguments: {to: ref('dim_date'), field: date_key}
  - name: mart_problem_ranking
    description: >
      Ranked problems. negative_share = negative or mixed posts / posts in that problem.
      priority_score = negative posts x lever weight (yes 1.0, partly 0.6, no 0.2) x (1 + ln(1 + average engagement)).
      is_small_group flags fewer than 20 posts.
  - name: mart_network_scorecard
    description: >
      Per network. share_of_voice = posts naming this network / all posts naming any network.
      Read cpo rows as partner quality, emsp_competitor rows as rival offers, the dcs row as our own visibility.
  - name: mart_voice_examples
    description: Top 3 complaints or requests per problem by engagement, plus every serious post, with a risk bucket.
  - name: mart_monthly_trend
    description: Posts and negative share per month, only for themes DCS can act on. is_small_group flags fewer than 10 posts.
